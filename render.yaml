services:
  - type: web
    name: stride-course
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci && npm run build
    # Render's pre-deploy command is not available on free web services.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    previews:
      generation: automatic
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Service previews share this disposable database but use an isolated
      # PostgreSQL schema derived from RENDER_SERVICE_NAME.
      - key: DB_URL
        fromDatabase:
          name: stride-course-db
          property: connectionString

databases:
  - name: stride-course-db
    plan: free
    region: ohio
    databaseName: stride
    user: stride
    # The app and preview instances connect over Render's private network.
    ipAllowList: []
